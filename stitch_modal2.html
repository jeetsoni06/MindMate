<script type="module">import { supabase } from '../lib/supabaseClient';

export const saveJournalEntry = async (text) => {
  const { data, error } = await supabase
    .from('journals')
    .insert([
      { 
        content_text: text, 
        user_id: '00000000-0000-0000-0000-000000000000' 
      }
    ]);
  if (error) {
    console.error('Supabase Error Details:', error);
    throw error;
  }
  return data;
};

async function handleSave() {
  const textarea = document.getElementById('journal-textarea');
  const content = textarea.value;
  
  if (!content.trim()) {
    alert('Please enter some thoughts before saving.');
    return;
  }

  try {
    await saveJournalEntry(content);
    console.log('Journal Entry Saved:', content);
    textarea.value = '';
    alert('Entry saved successfully!');
  } catch (error) {
    alert('Failed to save entry.');
  }
}

// Expose function to global scope for inline onclick handlers
window.handleSave = handleSave;</script></body></html>
